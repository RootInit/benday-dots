[package]
name = "benday-dots"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Turn photos into Silver-Age comic prints with Ben-Day dots, as a library and a CLI"
readme = "README.md"
repository = "https://github.com/RootInit/benday-dots"
authors = ["RootInit"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
license = "MIT OR Apache-2.0"
keywords = ["image", "comic", "halftone", "ben-day", "pop-art"]
categories = ["multimedia::images", "command-line-utilities"]

[features]
default = ["cli", "io"]
cli = ["io", "dep:clap"]
io = ["image/png", "image/jpeg", "dep:crc32fast", "dep:simd-adler32"]

[lib]
name = "benday_dots"

[[bin]]
name = "benday-dots"
required-features = ["cli"]

[[example]]
name = "convert"
required-features = ["io"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["rayon"] }
palette = "0.7.7"
rayon = "1.12.0"
clap = { version = "4.6.7", features = ["derive"], optional = true }
crc32fast = { version = "1.5.3", optional = true }
simd-adler32 = { version = "0.3.10", optional = true }
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }

[dev-dependencies]
fdeflate = "0.3.7"
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
